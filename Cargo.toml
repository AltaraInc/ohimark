[package]
name = "ohimark"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Generate a static HTML site from a directory of Markdown."

[[bin]]
name = "ohimark"
path = "src/main.rs"

[lib]
name = "ohimark"
path = "src/lib.rs"

[dependencies]
camino = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
merman = "0.8.0-alpha.6"
percent-encoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rayon = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
